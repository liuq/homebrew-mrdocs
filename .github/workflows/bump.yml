name: Bump mrdocs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: bump
        run: |
          set -euo pipefail
          latest=$(gh release view -R cppalliance/mrdocs --json tagName --jq .tagName)
          current=$(sed -nE 's/^ +tag: +"([^"]+)".*/\1/p' Formula/mrdocs.rb)
          echo "current=$current latest=$latest"
          if [ "$latest" = "$current" ]; then
            echo "Already up to date."
            exit 0
          fi
          branch="bump-mrdocs-$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; not opening another PR."
            exit 0
          fi

          commit=$(gh api "repos/cppalliance/mrdocs/commits/$latest" --jq .sha)
          sha() {
            gh release view "$latest" -R cppalliance/mrdocs --json assets \
              --jq ".assets[] | select(.name == \"MrDocs-$latest-$1.tar.xz\") | .digest" | sed 's/^sha256://'
          }
          darwin=$(sha Darwin)
          linux=$(sha Linux)
          if [ -z "$darwin" ] || [ -z "$linux" ]; then
            echo "Release $latest is missing the Darwin or Linux .tar.xz asset." >&2
            exit 1
          fi
          python3 .github/scripts/bump.py "$latest" "$commit" "$darwin" "$linux"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "mrdocs, mrdocs-bin $latest"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "mrdocs, mrdocs-bin $latest" \
            --body "Automated bump to [mrdocs $latest](https://github.com/cppalliance/mrdocs/releases/tag/$latest) (from $current).

            The build and test results for this branch are in the **Bump mrdocs** workflow run that opened this PR.
            If \`mrdocs\` fails to build, check whether the release already includes cppalliance/mrdocs#1334: in that case the \`patch :DATA\` block in \`Formula/mrdocs.rb\` must be removed."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  test:
    needs: bump
    if: needs.bump.outputs.branch != ''
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
